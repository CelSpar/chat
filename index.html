<!DOCTYPE html>  <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Realtime Chat</title>  <style>  :root{ --primary:#0084ff; --primary-dark:#006edc; --bg:#f0f2f5; --text:#111; --update-bg:#fff; }  body.dark{ --bg:#111; --text:#f0f0f0; --update-bg:#222; }  *{box-sizing:border-box;margin:0;padding:0;}  body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }  /* ACCOUNT LOGIN BUTTON */  #account-login{ position:absolute; top:15px; left:15px; padding:6px 12px; border:none; border-radius:8px; background:#444; color:white; cursor:pointer; font-weight:600; }  /* LOGIN POPUP */  #account-box{ display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:25px; border-radius:10px; box-shadow:0 5px 20px rgba(0,0,0,0.3); z-index:100; }  /* UPDATE SCREEN */  #update-screen{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px; padding:40px; text-align:left; position:relative; background:var(--update-bg); border-radius:10px; max-width:480px; margin:40px auto; box-shadow:0 4px 15px rgba(0,0,0,0.2); }  #theme-toggle{ position:absolute; top:20px; right:20px; padding:6px 12px; border:none; border-radius:8px; cursor:pointer; background:var(--primary); color:white; font-weight:600; }  #update-log{ line-height:1.7; font-size:15px; max-width:420px; }  #older-versions{display:none;margin-top:10px;}  /* NICKNAME SCREEN */  #nickname-screen{ display:none; flex:1; flex-direction:column; justify-content:center; align-items:center; gap:20px; }  /* CHAT */  #chat-container{ display:none; flex:1; flex-direction:column; overflow:hidden; }  #messages-wrapper{ flex:1; overflow-y:auto; padding:16px; background:white; scroll-behavior:smooth; }  body.dark #messages-wrapper{ background:#1b1b1b; }  #messages{ display:flex; flex-direction:column; }  .message{ margin:8px 0; padding:10px 14px; border-radius:18px; max-width:80%; word-wrap:break-word; font-size:15px; cursor:pointer; animation:fadeIn .2s ease; }  .message.sent{ background:var(--primary); color:white; margin-left:auto; }  .message.received{ background:#e5e5ea; margin-right:auto; }  .name{ font-size:12px; font-weight:600; margin-bottom:3px; }  .time-btn{ font-size:10px; padding:2px 6px; border:none; border-radius:10px; margin-bottom:3px; background:rgba(0,0,0,0.1); cursor:pointer; }  .message.sent .time-btn{ background:rgba(255,255,255,0.25); color:white; }  /* reactions */  .reactions{ margin-top:5px; font-size:12px; opacity:.85; }  .reaction-panel{ display:none; gap:10px; margin-top:6px; background:#f0f0f0; padding:6px; border-radius:10px; width:fit-content; }  .reaction-panel span{ cursor:pointer; font-size:18px; }  /* typing */  .typing{ font-size:12px; opacity:.7; padding:5px; }  /* input */  #input-area{ padding:10px; border-top:1px solid #ddd; background:white; }  form{ display:flex; gap:10px; }  input{ flex:1; padding:12px; border-radius:20px; border:1px solid #ddd; font-size:16px; }  button{ padding:10px 20px; border:none; border-radius:20px; background:var(--primary); color:white; font-weight:600; cursor:pointer; }  button:hover{ background:var(--primary-dark); }  a{color:#006edc;}  @keyframes fadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }  </style>  </head>  <body>  <button id="account-login">Account Login</button>  <div id="account-box"> <h3>Account Login</h3>  <input id="acc-user" placeholder="Username"><br><br> <input id="acc-pass" type="password" placeholder="Password"><br><br>  <button onclick="loginAccount()">Login</button> <button onclick="closeLogin()">Cancel</button>  </div>  <!-- UPDATE SCREEN -->  <div id="update-screen">  <button id="theme-toggle">Dark Mode</button>  <h2>Improved to 1.2.3 Version!</h2>  <div id="update-log">  <b>This Update:</b><br><br>  ✅ more emojis<br> ✅ Dark&Light mode<br> ✅ Update Panel<br> ✅ Minor bug fixs<br><br>  <button id="show-all-btn">Show All Versions</button>  <div id="older-versions">  <b>1.2.2</b><br> Reactions system<br><br>  <b>1.2.1</b><br> Typing indicator<br><br>  — Dev <b>parrotxie</b>  </div>  </div>  <button onclick="enterLogin()">Continue</button>  </div>  <!-- NICKNAME -->  <div id="nickname-screen">  <h2>Enter your name</h2>  <input id="nickname" placeholder="Name">  <button onclick="startChat()">Join Chat</button>  </div>  <!-- CHAT -->  <div id="chat-container">  <div id="messages-wrapper">  <div id="messages"></div>  <div id="typing" class="typing"></div>  </div>  <div id="input-area">  <form id="chat-form">  <input id="message" placeholder="Type message">  <button type="submit">Send</button>  </form>  </div>  </div>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>  /* SUPABASE */  const SUPABASE_URL="https://yrtqjhtyaguersnatqbe.supabase.co"; const SUPABASE_KEY="YOUR_PUBLIC_KEY";  const {createClient}=supabase;  const supabaseClient=createClient(SUPABASE_URL,SUPABASE_KEY);  let currentUser=null;  /* DOM */  const messagesDiv=document.getElementById("messages"); const wrapper=document.getElementById("messages-wrapper"); const form=document.getElementById("chat-form"); const input=document.getElementById("message"); const typingDiv=document.getElementById("typing");  /* ACCOUNT LOGIN */  const loginBtn=document.getElementById("account-login"); const loginBox=document.getElementById("account-box");  loginBtn.onclick=()=>loginBox.style.display="block";  function closeLogin(){ loginBox.style.display="none"; }  async function loginAccount(){  const user=document.getElementById("acc-user").value.trim(); const pass=document.getElementById("acc-pass").value;  if(!user||!pass){ alert("Enter username and password"); return; }  const encoded=btoa(btoa(pass));  const res=await fetch("/passwords.json"); const accounts=await res.json();  const found=accounts.find(acc=>acc.username===user && acc.password===encoded);  if(found){  currentUser=user;  loginBox.style.display="none"; document.getElementById("update-screen").style.display="none"; document.getElementById("chat-container").style.display="flex";  loadMessages(); subscribeRealtime();  }else{  alert("Invalid login");  }  }  /* UPDATE SCREEN */  function enterLogin(){  document.getElementById("update-screen").style.display="none"; document.getElementById("nickname-screen").style.display="flex";  }  /* DARK MODE */  const themeBtn=document.getElementById("theme-toggle");  themeBtn.onclick=()=>{ document.body.classList.toggle("dark"); themeBtn.textContent=document.body.classList.contains("dark")?"Light Mode":"Dark Mode"; };  /* SHOW VERSIONS */  document.getElementById("show-all-btn").onclick=()=>{ document.getElementById("older-versions").style.display="block"; };  /* TIME FORMAT */  function formatTime(date){ const d=new Date(date); return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0'); }  /* LINKIFY */  function linkify(text){ return text.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>'); }  /* START CHAT */  function startChat(){  const nick=document.getElementById("nickname").value.trim();  if(!nick) return alert("Enter a name");  currentUser=nick;  document.getElementById("nickname-screen").style.display="none"; document.getElementById("chat-container").style.display="flex";  loadMessages(); subscribeRealtime();  }  /* LOAD MESSAGES */  async function loadMessages(){  const {data}=await supabaseClient .from("messages") .select("*") .order("created_at",{ascending:false}) .limit(100);  data.reverse().forEach(addMessage);  scrollBottom();  }  /* ADD MESSAGE */  function addMessage(row){  const div=document.createElement("div");  div.className="message "+(row.name===currentUser?"sent":"received");  div.dataset.id=row.id;  const time=formatTime(row.created_at);  div.innerHTML=` <button class="time-btn">${time}</button> <div class="name">${row.name}</div> <div>${linkify(row.content)}</div> <div class="reactions"></div> <div class="reaction-panel"> <span data-emoji="✅">✅</span> <span data-emoji="❌">❌</span> <span data-emoji="😂">😂</span> </div> `;  const panel=div.querySelector(".reaction-panel");  div.onclick=()=>{ panel.style.display=panel.style.display==="flex"?"none":"flex"; };  panel.querySelectorAll("span").forEach(btn=>{ btn.onclick=(e)=>{ e.stopPropagation(); addReaction(row.id,btn.dataset.emoji); panel.style.display="none"; }; });  messagesDiv.appendChild(div);  loadReactions(row.id,div);  scrollBottom();  }  /* REACTIONS */  async function loadReactions(messageId,messageDiv){  const {data}=await supabaseClient .from("reactions") .select("*") .eq("message_id",messageId);  const reactionsDiv=messageDiv.querySelector(".reactions");  const grouped={};  data.forEach(r=>{ if(!grouped[r.emoji]) grouped[r.emoji]=[]; grouped[r.emoji].push(r.username); });  reactionsDiv.innerHTML="";  for(const emoji in grouped){  const users=grouped[emoji];  const span=document.createElement("div"); span.textContent=emoji+" "+users.length+" ("+users.join(", ")+")";  reactionsDiv.appendChild(span);  }  }  async function addReaction(messageId,emoji){  await supabaseClient .from("reactions") .insert({ message_id:messageId, username:currentUser, emoji:emoji });  }  /* SCROLL */  function scrollBottom(){ wrapper.scrollTop=wrapper.scrollHeight; }  /* REALTIME */  function subscribeRealtime(){  supabaseClient.channel("messages") .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{ if(payload.new.name!==currentUser) addMessage(payload.new); }) .subscribe();  supabaseClient.channel("reactions") .on("postgres_changes",{event:"INSERT",schema:"public",table:"reactions"},payload=>{  const messageId=payload.new.message_id;  const message=document.querySelector('.message[data-id="'+messageId+'"]');  if(message) loadReactions(messageId,message);  }) .subscribe();  }  /* SEND MESSAGE */  form.addEventListener("submit",async e=>{  e.preventDefault();  let content=input.value.trim();  if(!content) return;  input.value="";  const {data}=await supabaseClient .from("messages") .insert({name:currentUser,content}) .select() .single();  addMessage(data);  });  /* TYPING */  input.addEventListener("input",()=>{  supabaseClient.channel("typing").send({ type:"broadcast", event:"typing", payload:{user:currentUser} });  });  supabaseClient.channel("typing") .on("broadcast",{event:"typing"},payload=>{  if(payload.payload.user!==currentUser){  typingDiv.textContent=payload.payload.user+" is typing...";  setTimeout(()=>typingDiv.textContent="",1500);  }  }) .subscribe();  </script>  </body> </html>
